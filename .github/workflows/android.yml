# App Android (casca do Projeto R).
# - compilar: a cada mudança em android/, confere que a casca compila (APK de teste, sem assinatura).
# - publicar: numa tag android-vN (ou à mão), monta o APK assinado e o publica na página de versões.
name: android

on:
  push:
    branches: ['**']
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['android-v*'] # filtros de caminho não valem para tags
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Número da versão do APK (ex.: 3)'
        required: true

jobs:
  compilar:
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar, testar e checar o release
        run: gradle -p android assembleDebug testDebugUnitTest lintVitalRelease --no-daemon

  publicar:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Número da versão
        id: versao
        env:
          ENTRADA: ${{ inputs.versao }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then N="$ENTRADA"; else N="${GITHUB_REF_NAME#android-v}"; fi
          case "$N" in ''|*[!0-9]*) echo "Versão inválida: '$N' (use só números, ex.: android-v3)"; exit 1;; esac
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Chave de assinatura
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "Falta o segredo ANDROID_KEYSTORE_B64"; exit 1; fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/chave.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/chave.p12" >> "$GITHUB_ENV"

      - name: Compilar o APK assinado
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android assembleRelease -PversaoApp=${{ steps.versao.outputs.n }} --no-daemon

      - name: Conferir a assinatura
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk projeto-r.apk

      - name: Publicar na página de versões
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.versao.outputs.n }}
        run: |
          gh release create "android-v$N" projeto-r.apk \
            --target "$GITHUB_SHA" \
            --title "App Android $N" \
            --notes-file - <<'NOTAS'
          Como instalar no celular:

          1. Toque em **projeto-r.apk** para baixar.
          2. Abra o arquivo baixado. Se o Android pedir, libere "instalar apps desconhecidos" para o navegador.
          3. Se aparecer o aviso do Play Protect ("app não reconhecido"), toque em "Instalar mesmo assim".
          4. Ao abrir pela primeira vez, aceite as notificações e cole a sua chave do GitHub (crie uma nova chamada "Projeto R (app Android)").
          5. Os lembretes do dia do pagamento ficam em Mais › Ajustes › Lembretes.

          Para atualizar, é só instalar o APK novo por cima: os dados continuam no GitHub.
          NOTAS
